async function load(){let x=atob(P),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);let st=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));D=JSON.parse(await new Response(st).text());cur=D[0];render();}
function nav(id){document.querySelectorAll('section').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('aside button').forEach(x=>x.classList.toggle('on',x.dataset.s===id));}
function render(){let clients=new Set(D.map(x=>x.c)),years=new Set(D.map(x=>x.a));dash.innerHTML=`<div class="grid"><div class="card kpi"><b>${D.length}</b><span>Projetos</span></div><div class="card kpi"><b>${clients.size}</b><span>Clientes</span></div><div class="card kpi"><b>${years.size}</b><span>Anos</span></div><div class="card kpi"><b>${D.filter(x=>/conclu/i.test(x.s||'')).length}</b><span>Concluídos</span></div></div>`;
proj.innerHTML=`<h2>Projetos</h2><div class="card"><input id="q" placeholder="Buscar projeto/cliente"><table><thead><tr><th>Projeto</th><th>Cliente</th><th>Ano</th><th>Áreas</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div>`;draw();qualidade();documentos();}
function draw(){let q=(document.getElementById('q')?.value||'').toLowerCase(),L=D.filter(x=>[x.i,x.c,...x.t,...x.w].join(' ').toLowerCase().includes(q));tb.innerHTML=L.map(x=>`<tr><td class="click" data-i="${e(x.i)}">${e(x.i)}</td><td>${e(x.c)}</td><td>${e(x.a)}</td><td>${x.t.map(b).join(' ')}</td><td>${b(x.s)}</td></tr>`).join('');document.querySelectorAll('[data-i]').forEach(z=>z.onclick=()=>{cur=D.find(x=>x.i===z.dataset.i);qualidade();documentos();nav('qual')});document.getElementById('q').oninput=draw;}
function qualidade(){if(!cur)return;qual.innerHTML=`<h2>${e(cur.i)}</h2><div class="card"><b>Checklist V6:</b> ${cur.k[0]} de ${cur.k[1]} itens conformes</div><div class="card"><h3>Gates</h3><table><thead><tr><th>Gate</th><th>Status</th></tr></thead><tbody>${cur.g.map(g=>`<tr><td>${e(g[0])}</td><td>${b(g[1])}</td></tr>`).join('')}</tbody></table></div>`}
function documentos(){if(!cur)return;docs.innerHTML=`<h2>Documentos referenciados — ${e(cur.i)}</h2><div class="card"><p class="small">Referências históricas; arquivos originais indisponíveis.</p>${cur.d.length?'<ul>'+cur.d.map(x=>`<li>${e(x)}</li>`).join('')+'</ul>':'Nenhum documento referenciado.'}</div>`}
