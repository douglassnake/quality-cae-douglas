<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q-SIM — Plataforma de Qualidade CAE</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1e293b;--muted:#64748b;--brand:#164e63;--accent:#0f766e;--warn:#b45309;--bad:#b91c1c;--line:#d8dee8;--soft:#eef2f7}
*{box-sizing:border-box}body{margin:0;font:14px Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--brand);color:#fff;padding:15px 20px;border-bottom:4px solid var(--accent)}header h1{margin:0;font-size:21px}header small{color:#d9fbf6}.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 70px)}aside{background:#0f2f3b;padding:12px}aside button{width:100%;border:0;background:transparent;color:#e6f6f4;text-align:left;padding:10px;border-radius:6px;cursor:pointer;margin-bottom:2px}aside button:hover,aside button.on{background:#176b73}main{padding:18px;min-width:0}section{display:none}section.on{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}.kpi b{display:block;font-size:28px;color:var(--brand)}.muted,.small{color:var(--muted)}.small{font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select,button.action{padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff}button.action{cursor:pointer}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#e0f2f1;color:#115e59;font-size:11px;font-weight:bold;margin:1px}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.neutral{background:#e5e7eb;color:#374151}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--soft)}.click{color:var(--accent);font-weight:bold;cursor:pointer}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px;border-radius:7px;margin-bottom:12px}.score{font-size:20px;font-weight:bold;color:var(--brand)}.bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}.tabs button.on{background:var(--accent);color:#fff}.list{margin:0;padding-left:18px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.empty{padding:20px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto}aside button{white-space:nowrap;width:auto}.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Q-SIM — Base de Conhecimento e Qualidade CAE</h1><small>MVP consolidado · recuperação V6 + similaridade + governança</small></header>
<div class="layout"><aside>
<button class="on" data-s="dash">Dashboard</button><button data-s="projects">Projetos</button><button data-s="quality">Checklist e Gates</button><button data-s="knowledge">Conhecimento</button><button data-s="search">Busca</button><button data-s="documents">Documentos</button><button data-s="governance">Governança</button>
</aside><main>
<div class="notice">Os relatórios e propostas originais não estão disponíveis. A plataforma usa apenas dados estruturados recuperados. Ausência documental não é tratada automaticamente como não conformidade.</div>
<section id="dash" class="on"></section><section id="projects"></section><section id="quality"></section><section id="knowledge"></section><section id="search"></section><section id="documents"></section><section id="governance"></section>
</main></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const badge=s=>{let t=String(s||'');let c=/reprov|não conforme/i.test(t)?'bad':/pend|ressal|não ident|insuf/i.test(t)?'warn':/não aplic/i.test(t)?'neutral':'';return `<span class="badge ${c}">${esc(t||'—')}</span>`};
const low=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const tokens=s=>new Set(low(s).split(/[^a-z0-9]+/).filter(x=>x.length>2));
const jacc=(A,B)=>{if(!A.size&&!B.size)return null;let i=0;A.forEach(x=>B.has(x)&&i++);let u=new Set([...A,...B]).size;return u?i/u:null};
let D=[],cur=null;
async function loadData(){const r=await fetch('index.html',{cache:'no-store'});if(!r.ok)throw new Error('index.html não encontrado');const h=await r.text();const m=h.match(/const P="([A-Za-z0-9+/=]+)"/);if(!m)throw new Error('Base compactada não localizada');const bin=atob(m[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Navegador sem DecompressionStream');const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(st).text())}
function nav(id){document.querySelectorAll('section').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('aside button').forEach(x=>x.classList.toggle('on',x.dataset.s===id))}
function similarity(a,b){const dims=[];const add=(n,w,v,d)=>{if(v!==null&&!Number.isNaN(v))dims.push({n,w,v,d})};const A=new Set((a.t||[]).map(low)),B=new Set((b.t||[]).map(low));add('Modalidade/áreas',40,jacc(A,B),'áreas/tipos compartilhados');const SA=new Set((a.w||[]).map(low)),SB=new Set((b.w||[]).map(low));add('Software',25,jacc(SA,SB),'softwares compartilhados');add('Título/objeto',20,jacc(tokens(a.i),tokens(b.i)),'similaridade lexical');add('Documentos',10,jacc(tokens((a.d||[]).join(' ')),tokens((b.d||[]).join(' '))),'termos em referências documentais');add('Cliente',5,a.c&&b.c?(low(a.c)===low(b.c)?1:0):null,'mesmo/diferente cliente');const den=dims.reduce((s,d)=>s+d.w,0),score=den?dims.reduce((s,d)=>s+d.w*d.v,0)/den:0;return{score,dims}}
const level=s=>{let p=Math.round(s*100);return p>=90?'Muito semelhante':p>=75?'Semelhante':p>=55?'Parcialmente semelhante':p>=35?'Baixa similaridade':'Pouco relevante'};
function gateSignals(p){return (p.g||[]).filter(g=>/pend|ressal|não|reprov/i.test(g[1]||''))}
function recurring(){const map=new Map();D.forEach(p=>(p.t||[]).forEach(x=>map.set(x,(map.get(x)||0)+1)));return [...map.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10)}
function renderDash(){const clients=new Set(D.map(x=>x.c).filter(Boolean)),years=new Set(D.map(x=>x.a).filter(Boolean));const withIssues=D.filter(p=>gateSignals(p).length).length;dash.innerHTML=`<div class="grid"><div class="card kpi"><b>${D.length}</b><span>Projetos</span></div><div class="card kpi"><b>${clients.size}</b><span>Clientes</span></div><div class="card kpi"><b>${years.size}</b><span>Anos</span></div><div class="card kpi"><b>${withIssues}</b><span>Projetos com Gates a revisar</span></div></div><div class="split"><div class="card"><h3>Áreas mais recorrentes</h3><table>${recurring().map(x=>`<tr><td>${esc(x[0])}</td><td><b>${x[1]}</b></td></tr>`).join('')}</table></div><div class="card"><h3>Princípios de governança</h3><ul class="list"><li>V6 é referência visual.</li><li>Dados recuperados são preservados sem inferência indevida.</li><li>Recomendações não alteram Checklist/Gates automaticamente.</li><li>Documentos originais são fontes opcionais futuras.</li></ul></div></div>`}
function renderProjects(){projects.innerHTML=`<h2>Projetos</h2><div class="card toolbar"><input id="pq" placeholder="Buscar projeto, cliente, área ou software"><select id="py"><option value="">Todos os anos</option>${[...new Set(D.map(x=>x.a))].sort().map(y=>`<option>${esc(y)}</option>`).join('')}</select></div><div class="card"><table><thead><tr><th>Projeto</th><th>Cliente</th><th>Ano</th><th>Áreas</th><th>Software</th><th>Status</th></tr></thead><tbody id="pt"></tbody></table></div>`;const draw=()=>{let q=low(pq.value),y=py.value;let L=D.filter(p=>(!y||String(p.a)===y)&&low([p.i,p.c,...(p.t||[]),...(p.w||[])].join(' ')).includes(q));pt.innerHTML=L.map(p=>`<tr><td class="click" data-id="${esc(p.i)}">${esc(p.i)}</td><td>${esc(p.c)}</td><td>${esc(p.a)}</td><td>${(p.t||[]).map(badge).join(' ')}</td><td>${(p.w||[]).map(badge).join(' ')}</td><td>${badge(p.s)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhum projeto encontrado.</td></tr>';document.querySelectorAll('[data-id]').forEach(a=>a.onclick=()=>{cur=D.find(x=>x.i===a.dataset.id);renderQuality();renderKnowledge();renderDocuments();nav('quality')})};pq.oninput=draw;py.onchange=draw;draw()}
function renderQuality(){if(!cur){quality.innerHTML='<div class="card empty">Selecione um projeto em Projetos.</div>';return}const k=cur.k&&cur.k.length>1?`${cur.k[0]} de ${cur.k[1]} conformes`:'Não disponível';const sig=gateSignals(cur);quality.innerHTML=`<h2>${esc(cur.i)}</h2><div class="grid"><div class="card kpi"><b>${esc(k)}</b><span>Checklist recuperado</span></div><div class="card kpi"><b>${(cur.g||[]).length}</b><span>Gates registrados</span></div><div class="card kpi"><b>${sig.length}</b><span>Gates a revisar</span></div></div><div class="card"><h3>Gates históricos</h3><table><thead><tr><th>Gate</th><th>Status recuperado</th><th>Interpretação</th></tr></thead><tbody>${(cur.g||[]).map(g=>`<tr><td>${esc(g[0])}</td><td>${badge(g[1])}</td><td>${/pend/i.test(g[1]||'')?'Projeto histórico: tratar como evidência não confirmada, não como tarefa pendente atual.':'Preservar status recuperado até nova evidência.'}</td></tr>`).join('')}</tbody></table></div><div class="card"><p class="small">A plataforma não recalcula conformidade sem evidência documental nova. O status acima é histórico/recuperado.</p></div>`}
function renderKnowledge(){if(!cur){knowledge.innerHTML='<div class="card empty">Selecione um projeto em Projetos.</div>';return}const rows=D.filter(x=>x!==cur).map(x=>({x,...similarity(cur,x)})).sort((a,b)=>b.score-a.score).slice(0,5);knowledge.innerHTML=`<h2>Conhecimento — ${esc(cur.i)}</h2><div class="card"><h3>Top 5 projetos relacionados</h3><table><thead><tr><th>Projeto</th><th>Score</th><th>Classificação</th><th>Explicação</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.x.i)}<br><span class="small">${esc(r.x.c)} · ${esc(r.x.a)}</span></td><td><span class="score">${Math.round(r.score*100)}%</span><div class="bar"><i style="width:${Math.round(r.score*100)}%"></i></div></td><td>${badge(level(r.score))}</td><td>${r.dims.map(d=>`${esc(d.n)}: ${Math.round(d.v*100)}%`).join('<br>')}</td></tr>`).join('')}</tbody></table></div><div class="split"><div class="card"><h3>Referências reutilizáveis</h3><p><b>Áreas:</b> ${(cur.t||[]).map(badge).join(' ')||'—'}</p><p><b>Software:</b> ${(cur.w||[]).map(badge).join(' ')||'—'}</p><p class="small">Esses itens são referências históricas, não prescrições técnicas.</p></div><div class="card"><h3>Alertas de revisão</h3>${gateSignals(cur).length?`<ul class="list">${gateSignals(cur).map(g=>`<li>${esc(g[0])}: ${esc(g[1])}</li>`).join('')}</ul>`:'<p class="muted">Nenhum Gate sinalizado nos dados recuperados.</p>'}</div></div>`}
function renderSearch(){search.innerHTML=`<h2>Busca de conhecimento</h2><div class="card toolbar"><input id="sq" style="min-width:320px" placeholder="Ex.: CFD, CFX, malha, AQWA, modal..."><button class="action" id="sb">Buscar</button></div><div id="sr" class="card"></div>`;const go=()=>{let q=low(sq.value.trim());if(!q){sr.innerHTML='<div class="empty">Digite um termo.</div>';return}let rows=D.map(p=>{let text=low([p.i,p.c,...(p.t||[]),...(p.w||[]),...(p.d||[]),(p.g||[]).flat().join(' ')].join(' '));let hit=q.split(/\s+/).filter(Boolean).reduce((n,t)=>n+(text.includes(t)?1:0),0);return{p,hit}}).filter(x=>x.hit).sort((a,b)=>b.hit-a.hit);sr.innerHTML=rows.length?`<table><thead><tr><th>Projeto</th><th>Cliente</th><th>Áreas</th><th>Software</th><th>Correspondências</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="click" data-sid="${esc(x.p.i)}">${esc(x.p.i)}</td><td>${esc(x.p.c)}</td><td>${(x.p.t||[]).map(badge).join(' ')}</td><td>${(x.p.w||[]).map(badge).join(' ')}</td><td>${x.hit}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum resultado.</div>';document.querySelectorAll('[data-sid]').forEach(a=>a.onclick=()=>{cur=D.find(x=>x.i===a.dataset.sid);renderQuality();renderKnowledge();renderDocuments();nav('knowledge')})};sb.onclick=go;sq.onkeydown=e=>e.key==='Enter'&&go();sr.innerHTML='<div class="empty">A busca usa somente campos estruturados recuperados.</div>'}
function renderDocuments(){if(!cur){documents.innerHTML='<div class="card empty">Selecione um projeto em Projetos.</div>';return}documents.innerHTML=`<h2>Documentos — ${esc(cur.i)}</h2><div class="card"><p class="small">Referências preservadas. Os arquivos originais não estão disponíveis.</p>${(cur.d||[]).length?`<ul class="list">${cur.d.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div class="empty">Nenhuma referência documental recuperada.</div>'}</div>`}
function renderGovernance(){governance.innerHTML=`<h2>Governança e encerramento</h2><div class="grid"><div class="card"><h3>Estado do MVP</h3><ul class="list"><li>Base histórica recuperada e autossuficiente.</li><li>Dashboard e navegação por projetos.</li><li>Checklist/Gates históricos preservados.</li><li>Motor de similaridade explicável.</li><li>Busca transversal por conhecimento.</li><li>Referências documentais preservadas.</li></ul></div><div class="card"><h3>Limitações conhecidas</h3><ul class="list"><li>Sem PDFs/propostas originais para reanálise profunda.</li><li>Sem validação automática de evidências novas.</li><li>Score de similaridade usa apenas campos recuperados.</li><li>Não há autenticação nem banco transacional nesta versão estática.</li></ul></div></div><div class="card"><h3>Regra de continuidade</h3><p>Novos documentos poderão ser incorporados futuramente como entrada opcional. Nenhuma evolução deve depender de caminhos locais antigos, e nenhuma recomendação deve substituir julgamento técnico do engenheiro.</p></div>`}
function renderAll(){cur=cur||D[0];renderDash();renderProjects();renderQuality();renderKnowledge();renderSearch();renderDocuments();renderGovernance()}
document.querySelectorAll('aside button').forEach(b=>b.onclick=()=>nav(b.dataset.s));loadData().then(d=>{D=d;renderAll()}).catch(err=>document.querySelector('main').innerHTML=`<div class="card">Falha ao carregar a base: ${esc(err.message)}</div>`);
</script>
</body></html>
